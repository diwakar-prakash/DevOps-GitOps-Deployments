global:
  namespace: cloud-native

replicaCount: 2

gateway:
  image: diwakar5041/api-gateway
  tag: latest
  port: 8080

user:
  image: diwakar5041/user-service
  tag: latest
  port: 3001

product:
  image: diwakar5041/product-service
  tag: latest
  port: 3002

resources:
  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: true
  className: nginx

monitoring:
  enabled: true
  
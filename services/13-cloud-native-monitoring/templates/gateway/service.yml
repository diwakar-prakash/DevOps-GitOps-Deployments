apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway
  namespace: {{ .Values.global.namespace }}
  labels: {{- include "cloud-native-monitoring.labels" . | nindent 4 }}
spec:
  selector:
    app: gateway

  ports:
    - port: {{ .Values.gateway.port }}
      targetPort: {{ .Values.gateway.port }}

  type: ClusterIP

